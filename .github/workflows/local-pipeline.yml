# Runs the exact same gate as local development: ./localPipeline.sh
name: Local Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Run local pipeline
        run: ./localPipeline.sh --report-dir pipeline-reports
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-reports
          path: pipeline-reports
