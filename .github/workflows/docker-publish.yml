# SPDX-License-Identifier: GPL-3.0-or-later
# Build the docker image, smoke-test it and publish it to GHCR.
name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ntxhackathon22

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ntxbci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker_smoke.sh ntxbci:local
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for tag in latest "${{ steps.version.outputs.version }}" "sha-${GITHUB_SHA::7}"; do
            docker tag ntxbci:local "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
