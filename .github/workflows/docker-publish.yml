# Build the docker image, smoke-test it and publish it to GHCR - only for commits on main
# whose Local Pipeline run succeeded (or on manual dispatch).
name: Docker Publish

on:
  workflow_run:
    workflows: ["Local Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ntxhackathon22

jobs:
  docker:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # exactly the commit the green pipeline ran on
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read version
        id: version
        run: |
          echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ntxbci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker_smoke.sh ntxbci:local
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for tag in latest "${{ steps.version.outputs.version }}" "sha-${{ steps.version.outputs.sha }}"; do
            docker tag ntxbci:local "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
