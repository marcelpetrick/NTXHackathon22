[project]
name = "ntxbci"
version = "0.2.0"
description = "Cleaned-up NTX Hackathon 2022 BCI toolkit: OpenBCI Ganglion recordings, blink detection, epoching, web dashboard and a blink-controlled Pacman."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
]

[project.scripts]
ntxbci = "ntxbci.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntxbci"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# legacy hackathon code, replaced by src/ntxbci (exclusion removed then)
extend-exclude = ["pacman", "get_dynamic_spectrum.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4", "PTH"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests (browser, game replay, docker-free)",
]

[tool.coverage.run]
source = ["ntxbci"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
