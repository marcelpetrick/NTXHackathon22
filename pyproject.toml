[project]
name = "ntxbci"
version = "0.8.2"
description = "Cleaned-up NTX Hackathon 2022 BCI toolkit: OpenBCI Ganglion recordings, blink detection, epoching, web dashboard and a blink-controlled Pacman."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Marcel Petrick", email = "mail@marcelpetrick.it" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "jinja2>=3.1",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "scipy>=1.16",
    "uvicorn>=0.37",
]

[project.scripts]
ntxbci = "ntxbci.cli:main"

[project.optional-dependencies]
game = [
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "mypy>=1.18",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "playwright>=1.55",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntxbci"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4", "PTH"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "pygame", "pygame.*", "nbformat", "nbformat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nbformat ships partial annotations
module = ["tests.integration.test_notebook", "test_notebook"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests (browser, game replay, docker-free)",
]

[tool.coverage.run]
source = ["ntxbci"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
